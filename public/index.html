<script id="webgl_boot_path_restore_542">
(function () {
  "use strict";

  function canCreateWebGL() {
    try {
      const c = document.createElement("canvas");
      return !!(c.getContext("webgl") || c.getContext("experimental-webgl"));
    } catch (e) {
      return false;
    }
  }

  function bootRealGlobe() {
    const globe = document.getElementById("globeContainer");
    const rect = globe && globe.getBoundingClientRect ? globe.getBoundingClientRect() : null;

    if (!window.THREE || !window.UmbraGlobe || typeof window.UmbraGlobe.initCore !== "function") {
      console.warn("[Batch542] boot skipped: THREE or UmbraGlobe missing");
      return false;
    }

    if (!canCreateWebGL()) {
      console.warn("[Batch542] boot skipped: WebGL unavailable");
      return false;
    }

    if (!rect || rect.width < 10 || rect.height < 10) {
      console.warn("[Batch542] boot skipped: globeContainer not sized", rect);
      return false;
    }

    try {
      const fallback = document.querySelector(".webgl-fallback-surface");
      if (fallback) fallback.remove();

      window.UmbraGlobe.state.renderer = null;
      window.UmbraGlobe.state.scene = null;
      window.UmbraGlobe.state.camera = null;
      window.UmbraGlobe.state.worldGroup = null;
      window.UmbraGlobe.state._booted = false;
      window.UmbraGlobe.state._coreInited = false;

      const result = window.UmbraGlobe.initCore();

      console.info("[Batch542] real globe boot attempted", {
        result,
        renderer: !!window.UmbraGlobe.state.renderer,
        scene: !!window.UmbraGlobe.state.scene,
        camera: !!window.UmbraGlobe.state.camera,
        worldGroup: !!window.UmbraGlobe.state.worldGroup,
        canvas: !!document.querySelector("#globeContainer canvas")
      });

      return !!window.UmbraGlobe.state.renderer;
    } catch (err) {
      console.error("[Batch542] real globe boot failed", err);
      return false;
    }
  }

  window.UmbraWebGLBootRestore542 = {
    canCreateWebGL,
    bootRealGlobe
  };

  window.addEventListener("load", function () {
  setTimeout(function () {
    if (
      window.UmbraGlobe &&
      window.UmbraGlobe.state &&
      (
        window.UmbraGlobe.state.renderer ||
        window.UmbraGlobe.state._coreInited ||
        window.UmbraGlobe.state._rafRunning
      )
    ) {
      console.info("[Batch549R] delayed Batch542 boot aborted: existing globe runtime active");
      return;
    }

    bootRealGlobe();
  }, 2200);
});
})();
