==================================================
SECTION 10 — V1 SOURCE PRIORITY ORDER
==================================================

Build/connect in this order:

1. HIFLD law enforcement locations
2. Manual Black Dragon targets
3. Black Dragon questionnaire
4. BJS agency data
5. City/county agency websites
6. Local budgets
7. FBI Crime Data Explorer
8. State POST/training boards
9. Procurement/grants
10. Associations
11. Open data
12. News/press signals

Reason:
Start with lat/lon + target existence first.
Then add scoring quality.
Then add recency and outreach context.

==================================================
SECTION 11 — MINIMUM V1 COMPLETION STANDARD
==================================================

Black Dragon V1 source system is usable when:

- HIFLD or manual data provides lat/lon
- every entity has a city_id
- every major city has visible targets
- every priority city has 3–5 targets
- every entity has at least 2 source signals
- every score has a trace
- top leads are ranked
- dossiers explain why the target matters
- sources can be expanded later without changing schema

==================================================
SECTION 12 — DO NOT DO IN V1
==================================================

Do not:
- build every source fully at once
- scrape restricted/private systems
- collect personal sensitive data
- track private individuals
- add new UI features during data integration
- touch globe math
- touch city projection math
- score per frame
- mutate render-layer objects directly

Only:
- load sources
- normalize entities
- enrich attributes
- score once
- validate
- display

==================================================
SECTION 13 — SIMPLE BUILD ORDER
==================================================

1. Create source folders.
2. Add manual_targets.json.
3. Add questionnaire.json.
4. Add HIFLD loader.
5. Normalize all entities.
6. Assign city_id.
7. Add scoring.
8. Generate score traces.
9. Validate top 10.
10. Validate city coverage.
11. Validate dossiers.
12. Lock client access.

