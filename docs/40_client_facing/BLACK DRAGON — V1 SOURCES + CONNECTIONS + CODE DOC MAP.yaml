1. HIFLD LOCAL LAW ENFORCEMENT LOCATIONS

USE:
- Core law enforcement location backbone
- agency names
- facility locations
- lat/lon
- nationwide coverage

CONNECTION:
HIFLD feeds the base entity layer.

TARGET CODE DOC:
public/globe/intel/sources/hifld.loader.js

DATA FILE:
public/data/sources/hifld_law_enforcement.geojson

