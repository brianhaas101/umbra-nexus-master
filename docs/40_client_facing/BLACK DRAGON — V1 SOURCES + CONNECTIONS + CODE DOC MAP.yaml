BLACK DRAGON — V1 SOURCES + CONNECTIONS + CODE DOC MAP

PURPOSE:
This document defines the V1 source stack for Black Dragon’s Nexus account and maps each source category to the code/docs/folders that should be built from or expanded over time.

GOAL:
Build a nationwide law-enforcement/public-safety intelligence layer where every major city on the Nexus map can show relevant targets with:
- agency name
- agency type
- city_id
- lat/lon
- source support
- score
- score trace
- dossier explanation

==================================================
SECTION 1 — V1 SOURCE STACK
==================================================

V1 should not try to include every possible source immediately.

V1 target:
- Federal sources: 8–12
- State sources: 1–3 per priority state
- City/county sources: 2–5 per major city
- Manual enrichment: allowed and expected

Minimum V1 goal:
- Every major city has at least 1–3 Black Dragon targets
- Priority cities have 3–5 targets
- Every target has lat/lon
- Every target has a score
- Every score has an explanation

