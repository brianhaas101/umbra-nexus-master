==================================================

Every source must normalize into this general shape:

{
  "entity_id": "BD-LEAD-0001",
  "name": "",
  "type": "law_enforcement",
  "agency_type": "",
  "city": "",
  "city_id": "",
  "state": "",
  "lat": 0,
  "lon": 0,
  "website": "",
  "contact_url": "",
  "attributes": {
    "population_served": null,
    "sworn_officers": null,
    "budget_estimate": null,
    "training_signal": null,
    "activity_signal": null,
    "procurement_signal": null,
    "manual_priority": null,
    "source_refs": []
  },
  "scores": {
    "umbraScore": 0
  },
  "_scoreTrace": {
    "blackDragon": null
  }
}

==================================================
SECTION 8 — SOURCE CONNECTION MODEL
==================================================

HIFLD:
creates base law enforcement entities with lat/lon.

BJS:
enriches agency size and population served.

FBI CDE:
adds activity/risk/training demand context.

Census:
adds city size and population context.

Procurement:
adds buying history and training purchase likelihood.

DOJ/Grants:
adds funding and budget strength.

State POST:
adds training requirement pressure.

State police/DPS:
adds statewide public safety context.

State procurement:
adds state-level buying behavior.

Associations:
adds target discovery and contact direction.

Official agency sites:
adds verification, command structure, contact paths.

Budgets:
adds purchasing capacity.

Open data:
adds city-level activity.

News/press:
adds recent activity and outreach timing.

Manual:
adds founder/client priority.

Questionnaire:
adds client-specific fit and targeting logic.

